<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="vkf-offline" content="public-only" />
    <title>Reconnect · VK Finance</title>
    <style>
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        background: #f0fdfa;
        font-family: system-ui, sans-serif;
        color: #12334b;
      }
      .card {
        max-width: 380px;
        margin: 24px;
        background: white;
        padding: 40px;
        border-radius: 24px;
        box-shadow: 0 12px 40px #134e4a0a;
        text-align: center;
      }
      .logo {
        display: inline-grid;
        place-items: center;
        width: 64px;
        height: 64px;
        border-radius: 18px;
        background: #115e59;
        color: white;
        font-weight: 800;
      }
      h1 {
        font-size: 26px;
        letter-spacing: -0.5px;
      }
      p {
        font-size: 14px;
        line-height: 1.7;
        color: #64748b;
      }
      a {
        display: inline-block;
        margin-top: 16px;
        border-radius: 10px;
        background: #115e59;
        color: white;
        padding: 12px 24px;
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="logo">VK</span>
      <h1>A moment to reconnect</h1>
      <p>
        You’re offline. Connect to the internet to view your finances or record
        a change.
      </p>
      <p>
        Your financial data and receipt photos are not stored in this offline
        page.
      </p>
      <a href="./">Try again</a>
    </main>
  </body>
</html>
