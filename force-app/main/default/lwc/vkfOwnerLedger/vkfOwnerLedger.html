<template>
  <section class="card toolbar">
    <div class="search">
      <lightning-input
        type="search"
        label="Search"
        variant="label-hidden"
        placeholder="Search payee, notes or reference"
        value={query}
        onchange={handleSearch}
      ></lightning-input>
    </div>
    <div class="segmented" role="tablist" aria-label="Filter">
      <template for:each={filters} for:item="f">
        <button
          key={f.label}
          class={f.cls}
          data-value={f.value}
          aria-selected={f.selected}
          role="tab"
          onclick={handleFilter}
        >
          {f.label}
        </button>
      </template>
    </div>
  </section>

  <section class="totals">
    <div class="total">
      <span class="total-label">In</span>
      <span class="num positive">{totals.income}</span>
    </div>
    <div class="total">
      <span class="total-label">Out</span>
      <span class="num negative">{totals.expenses}</span>
    </div>
    <div class="total">
      <span class="total-label">Entries</span>
      <span class="num">{totals.count}</span>
    </div>
  </section>

  <template lwc:if={loading}>
    <div class="card">
      <div
        class="skeleton"
        style="height: 18px; width: 40%; margin-bottom: 14px"
      ></div>
      <div class="skeleton" style="height: 44px; margin-bottom: 10px"></div>
      <div class="skeleton" style="height: 44px; margin-bottom: 10px"></div>
      <div class="skeleton" style="height: 44px"></div>
    </div>
  </template>

  <template lwc:elseif={error}>
    <div class="card empty" role="alert">
      <div class="empty-icon">⚠️</div>
      {error}
    </div>
  </template>

  <template lwc:elseif={groups.length}>
    <div class="fade-in">
      <template for:each={groups} for:item="g">
        <section key={g.key} class="card day">
          <h3 class="day-head">
            <span>{g.label}</span>
            <span class={g.netClass}>{g.net}</span>
          </h3>
          <ul class="list">
            <template for:each={g.items} for:item="t">
              <li key={t.id} class={t.rowClass}>
                <div class="avatar" style={t.avatar}>{t.initials}</div>
                <div class="row-main">
                  <div class="row-title">{t.title}</div>
                  <div class="row-sub">{t.sub}</div>
                  <template lwc:if={t.badges.length}>
                    <div class="badges">
                      <template for:each={t.badges} for:item="b">
                        <span key={b} class="chip">{b}</span>
                      </template>
                    </div>
                  </template>
                </div>
                <div class="right">
                  <div class={t.amountClass}>{t.amount}</div>
                  <template lwc:if={t.canVoid}>
                    <button
                      class="void-btn"
                      data-id={t.id}
                      data-title={t.title}
                      data-amount={t.amount}
                      onclick={handleVoid}
                      disabled={busy}
                    >
                      Void
                    </button>
                  </template>
                </div>
              </li>
            </template>
          </ul>
        </section>
      </template>
      <template lwc:if={nextCursor}>
        <button class="more" onclick={handleMore} disabled={loadingMore}>
          {moreLabel}
        </button>
      </template>
    </div>
  </template>

  <template lwc:else>
    <div class="card empty">
      <div class="empty-icon">🗂️</div>
      <p>No entries match.</p>
      <p class="muted">Use <strong>Add entry</strong> to record one.</p>
    </div>
  </template>
</template>
